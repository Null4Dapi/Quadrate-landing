<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 760" width="100%" height="100%" fill="none" role="img" aria-label="Mockup de la experiencia visual e interactiva Quadrate pe">
  <defs>
    <!-- Filtros de sombra suave y elevación -->
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#231212" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#231212" flood-opacity="0.14" />
    </filter>

    <!-- Máscara de recorte de la pantalla del smartphone -->
    <clipPath id="phone-clip">
      <rect x="234" y="46" width="274" height="586" rx="36" />
    </clipPath>

    <!-- Gradiente de fondo del mapa -->
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF0EB" />
      <stop offset="100%" stop-color="#E2EAE3" />
    </linearGradient>

    <!-- Gradiente para el halo del vehículo -->
    <radialGradient id="pulse-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-ui { font-family: Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- 1. Fondo orgánico difuminado (Paleta Editorial Cálida) -->
  <path d="M 200 160 C 130 90, 640 40, 710 180 C 770 300, 730 540, 650 640 C 570 730, 180 740, 130 650 C 70 560, 110 380, 150 280 Z" fill="#EFECE8" opacity="0.8" />

  <!-- 2. Smartphone Central con Interfaz de Búsqueda de Estacionamiento -->
  <g id="phone-device" filter="url(#shadow-card)">
    <!-- Contenedor y pantalla del teléfono -->
    <g clip-path="url(#phone-clip)">
      <!-- A. Fondo del mapa satelital/vectorial -->
      <rect x="234" y="46" width="274" height="586" fill="url(#map-bg)" />

      <!-- Manzanas urbanas (San Isidro Financiero) -->
      <rect x="246" y="106" width="60" height="74" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      <rect x="316" y="106" width="80" height="42" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      <rect x="406" y="106" width="90" height="60" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      
      <!-- Zona verde / Parque Andrés Reyes -->
      <rect x="316" y="158" width="80" height="46" rx="6" fill="#D3E5D7" stroke="#BDD6C2" stroke-width="1.5" />
      <text x="356" y="185" class="font-ui" font-size="8" font-weight="600" fill="#2E6B3E" text-anchor="middle">Parque Reyes</text>

      <rect x="246" y="190" width="60" height="88" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      <rect x="316" y="214" width="80" height="64" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      <rect x="406" y="176" width="90" height="102" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />

      <rect x="246" y="288" width="60" height="100" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      <rect x="316" y="288" width="80" height="100" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />
      <rect x="406" y="288" width="90" height="100" rx="6" fill="#F4F6F4" stroke="#DCE2DC" stroke-width="1.5" />

      <!-- Calles y avenidas principales -->
      <!-- Av. Javier Prado -->
      <path d="M 234 100 L 508 100" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
      <path d="M 234 100 L 508 100" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4" />
      <text x="440" y="97" class="font-ui" font-size="7.5" font-weight="600" fill="#718096">Av. Javier Prado</text>

      <!-- Av. Rivera Navarrete -->
      <path d="M 310 46 L 310 440" stroke="#FFFFFF" stroke-width="12" />
      <text x="306" y="260" class="font-ui" font-size="7" font-weight="500" fill="#94A3B8" transform="rotate(-90 306 260)">Av. Rivera Navarrete</text>

      <!-- Calle Las Begonias -->
      <path d="M 400 46 L 400 440" stroke="#FFFFFF" stroke-width="14" />
      <text x="396" y="240" class="font-ui" font-size="7" font-weight="500" fill="#94A3B8" transform="rotate(-90 396 240)">Calle Las Begonias</text>

      <!-- Calle transversal Dean Valdivia -->
      <path d="M 234 282 L 508 282" stroke="#FFFFFF" stroke-width="10" />

      <!-- Ruta de Navegación Vehicular hacia la cochera seleccionada -->
      <path d="M 276 360 L 310 360 L 310 248 L 398 248" fill="none" stroke="#231212" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 276 360 L 310 360 L 310 248 L 398 248" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Posición actual del vehículo (GPS) -->
      <circle cx="276" cy="360" r="14" fill="url(#pulse-halo)" />
      <circle cx="276" cy="360" r="6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />

      <!-- Pines de Cochera en el mapa -->
      <!-- Pin Secundario 1: S/ 7.00 -->
      <g transform="translate(254, 136)">
        <rect x="0" y="0" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-soft)" />
        <circle cx="8" cy="10" r="3.5" fill="#1B7A4B" />
        <text x="16" y="14" class="font-ui" font-size="9" font-weight="700" fill="#231212">S/ 7.00</text>
      </g>

      <!-- Pin Secundario 2: S/ 5.50 -->
      <g transform="translate(424, 130)">
        <rect x="0" y="0" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow-soft)" />
        <circle cx="8" cy="10" r="3.5" fill="#1B7A4B" />
        <text x="16" y="14" class="font-ui" font-size="9" font-weight="700" fill="#231212">S/ 5.50</text>
      </g>

      <!-- Pin Secundario 3 (Lleno): S/ 6.00 -->
      <g transform="translate(252, 310)">
        <rect x="0" y="0" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1" filter="url(#shadow-soft)" />
        <circle cx="8" cy="10" r="3.5" fill="#DC2626" />
        <text x="16" y="14" class="font-ui" font-size="9" font-weight="600" fill="#991B1B">Lleno</text>
      </g>

      <!-- Pin Principal Seleccionado (Playa Begonias - Destino) -->
      <g transform="translate(332, 206)">
        <!-- Etiqueta flotante destacada -->
        <rect x="0" y="0" width="134" height="38" rx="8" fill="#231212" filter="url(#shadow-card)" />
        <circle cx="14" cy="14" r="4.5" fill="#4ADE80" />
        <text x="24" y="17" class="font-ui" font-size="11" font-weight="700" fill="#FFFFFF">Plaza Begonias</text>
        <text x="24" y="30" class="font-ui" font-size="9.5" font-weight="500" fill="#C9BFBF">S/ 6.50/h · 12 libres</text>
        <!-- Flecha del pin hacia la calle -->
        <path d="M 67 38 L 73 45 L 61 45 Z" fill="#231212" />
        <circle cx="67" cy="46" r="4" fill="#C25E34" stroke="#FFFFFF" stroke-width="1.5" />
      </g>

      <!-- Barra de Búsqueda Superior -->
      <g transform="translate(244, 56)">
        <rect x="0" y="0" width="254" height="36" rx="18" fill="#FFFFFF" filter="url(#shadow-soft)" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="18" r="6" fill="none" stroke="#718096" stroke-width="1.8" />
        <line x1="22.5" y1="22.5" x2="27" y2="27" stroke="#718096" stroke-width="1.8" stroke-linecap="round" />
        <text x="36" y="22" class="font-ui" font-size="11" font-weight="500" fill="#231212">San Isidro Financiero</text>
        <!-- Chip de filtro activo -->
        <rect x="186" y="7" width="58" height="22" rx="11" fill="#E3E2F7" />
        <text x="215" y="21" class="font-ui" font-size="9" font-weight="700" fill="#231212" text-anchor="middle">15 min</text>
      </g>

      <!-- Panel Flotante Inferior de la App (Ficha de la Cochera / Reserva) -->
      <g transform="translate(242, 426)">
        <rect x="0" y="0" width="258" height="196" rx="20" fill="#FFFFFF" filter="url(#shadow-card)" />
        <!-- Indicador de arrastre -->
        <rect x="113" y="8" width="32" height="4" rx="2" fill="#E2E8F0" />

        <!-- Nombre y ETA -->
        <text x="16" y="32" class="font-ui" font-size="14" font-weight="700" fill="#231212">Playa Las Begonias</text>
        <text x="16" y="47" class="font-ui" font-size="10.5" font-weight="500" fill="#718096">A 450 m · ETA estimado: 6 min</text>

        <!-- Chips de características de cochera -->
        <g transform="translate(16, 56)">
          <rect x="0" y="0" width="68" height="19" rx="4" fill="#EDF7F2" />
          <text x="34" y="13" class="font-ui" font-size="9" font-weight="600" fill="#1B7A4B" text-anchor="middle">✓ 12 libres</text>

          <rect x="74" y="0" width="60" height="19" rx="4" fill="#F4F4F6" />
          <text x="104" y="13" class="font-ui" font-size="9" font-weight="500" fill="#4B5563" text-anchor="middle">Techado</text>

          <rect x="140" y="0" width="76" height="19" rx="4" fill="#F4F4F6" />
          <text x="178" y="13" class="font-ui" font-size="9" font-weight="500" fill="#4B5563" text-anchor="middle">Cámara 24h</text>
        </g>

        <!-- Fila de Tarifas Transparentes -->
        <line x1="16" y1="84" x2="242" y2="84" stroke="#F1F3F5" stroke-width="1" />
        <text x="16" y="100" class="font-ui" font-size="10" font-weight="500" fill="#718096">1ª Hora completa:</text>
        <text x="100" y="100" class="font-ui" font-size="11" font-weight="700" fill="#231212">S/ 6.50</text>
        <text x="146" y="100" class="font-ui" font-size="10" font-weight="500" fill="#718096">Fracc. 15m:</text>
        <text x="210" y="100" class="font-ui" font-size="11" font-weight="700" fill="#231212">S/ 1.60</text>
        <line x1="16" y1="108" x2="242" y2="108" stroke="#F1F3F5" stroke-width="1" />

        <!-- Botón Principal de Reserva por ETA -->
        <g transform="translate(16, 118)">
          <rect x="0" y="0" width="226" height="42" rx="21" fill="#231212" />
          <text x="113" y="23" class="font-ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Voy hacia allá (Asegurar)</text>
          <text x="113" y="34" class="font-ui" font-size="8.5" font-weight="500" fill="#C9BFBF" text-anchor="middle">Reserva garantizada por 15 min</text>
        </g>
      </g>

      <!-- Notch / Isla Dinámica Superior -->
      <rect x="315" y="50" width="112" height="20" rx="10" fill="#12161A" />
      <circle cx="410" cy="60" r="3.5" fill="#1E2328" />
    </g>

    <!-- Borde perimetral del smartphone -->
    <rect x="234" y="46" width="274" height="586" rx="36" stroke="#231212" stroke-width="2.5" fill="none" />
  </g>

  <!-- 3. Tarjeta Izquierda Flotante: Pase Digital y Reserva Activa -->
  <g id="card-pase-digital" filter="url(#shadow-card)" transform="translate(38, 205)">
    <rect x="0" y="0" width="186" height="225" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Chip Estado Activo -->
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#EDF7F2" />
      <circle cx="10" cy="11" r="3.5" fill="#1B7A4B" />
      <text x="18" y="15" class="font-ui" font-size="9" font-weight="700" fill="#1B7A4B">RESERVA ACTIVA</text>
    </g>

    <!-- Detalle de la Plaza -->
    <text x="14" y="56" class="font-ui" font-size="16" font-weight="800" fill="#231212">Plaza A-12</text>
    <text x="14" y="71" class="font-ui" font-size="10.5" font-weight="500" fill="#718096">Playa Las Begonias</text>

    <!-- Código QR Vectorial Estilizado -->
    <g transform="translate(14, 82)">
      <rect width="76" height="76" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="1" rx="6" />
      <!-- Ojos de esquina QR -->
      <rect x="6" y="6" width="20" height="20" fill="#231212" rx="2" />
      <rect x="10" y="10" width="12" height="12" fill="#FFFFFF" rx="1" />
      <rect x="13" y="13" width="6" height="6" fill="#231212" />

      <rect x="50" y="6" width="20" height="20" fill="#231212" rx="2" />
      <rect x="54" y="10" width="12" height="12" fill="#FFFFFF" rx="1" />
      <rect x="57" y="13" width="6" height="6" fill="#231212" />

      <rect x="6" y="50" width="20" height="20" fill="#231212" rx="2" />
      <rect x="10" y="54" width="12" height="12" fill="#FFFFFF" rx="1" />
      <rect x="13" y="57" width="6" height="6" fill="#231212" />

      <!-- Patrón de bits simulados -->
      <rect x="32" y="10" width="12" height="5" fill="#231212" />
      <rect x="32" y="20" width="6" height="10" fill="#231212" />
      <rect x="42" y="32" width="8" height="6" fill="#231212" />
      <rect x="12" y="32" width="10" height="5" fill="#231212" />
      <rect x="32" y="44" width="10" height="10" fill="#C25E34" />
      <rect x="50" y="44" width="14" height="6" fill="#231212" />
      <rect x="32" y="58" width="16" height="8" fill="#231212" />
    </g>

    <!-- Datos del Conductor y PIN -->
    <g transform="translate(100, 96)">
      <text x="0" y="0" class="font-ui" font-size="9" font-weight="600" fill="#718096">PIN DE CASO</text>
      <text x="0" y="16" class="font-mono" font-size="12" font-weight="700" fill="#231212">QD-7391</text>
      <text x="0" y="34" class="font-ui" font-size="9" font-weight="600" fill="#718096">PLACA</text>
      <text x="0" y="48" class="font-mono" font-size="11" font-weight="600" fill="#231212">BYZ-492</text>
    </g>

    <!-- Contador de Tiempo de Reserva (ETA) -->
    <g transform="translate(14, 172)">
      <rect x="0" y="0" width="158" height="38" rx="8" fill="#FDF2EC" stroke="#F6D3C2" stroke-width="1" />
      <text x="10" y="16" class="font-ui" font-size="9" font-weight="700" fill="#C25E34">VENTANA DE LLEGADA</text>
      <text x="10" y="30" class="font-ui" font-size="11" font-weight="600" fill="#231212">11:42 min restantes</text>
    </g>
  </g>

  <!-- 4. Píldora de Calificación y Confianza -->
  <g id="badge-stars" filter="url(#shadow-soft)" transform="translate(120, 142)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <path d="M 22 13 L 24.5 18.5 L 30.5 19.2 L 26 23.3 L 27.2 29.2 L 22 26.2 L 16.8 29.2 L 18 23.3 L 13.5 19.2 L 19.5 18.5 Z" fill="#D97706" />
    <text x="36" y="26" class="font-ui" font-size="14" font-weight="800" fill="#231212">4.9</text>
    <text x="64" y="26" class="font-ui" font-size="10.5" font-weight="500" fill="#718096">· 1,420 pases</text>
  </g>

  <!-- 5. Checklist Flotante Superior Derecho -->
  <!-- Pill 1: Disponibilidad en Vivo -->
  <g id="pill-disponibilidad" filter="url(#shadow-soft)" transform="translate(465, 96)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="22" cy="22" r="14" fill="#231212" />
    <path d="M 16 22 L 20 26 L 28 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="27" class="font-ui" font-size="12.5" font-weight="700" fill="#231212">Disponibilidad en vivo</text>
  </g>

  <!-- Pill 2: Reserva Dinámica por ETA -->
  <g id="pill-reserva-eta" filter="url(#shadow-soft)" transform="translate(465, 148)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="22" cy="22" r="14" fill="#231212" />
    <path d="M 16 22 L 20 26 L 28 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="27" class="font-ui" font-size="12.5" font-weight="700" fill="#231212">Reserva por ETA (15 min)</text>
  </g>

  <!-- 6. Tarjeta Derecha de Métrica Destacada: -80% Búsqueda de Parqueo -->
  <g id="card-metric" filter="url(#shadow-card)" transform="translate(530, 310)">
    <rect x="0" y="0" width="168" height="168" rx="24" fill="#231212" />
    <text x="22" y="34" class="font-ui" font-size="10.5" font-weight="700" fill="#E3E2F7" letter-spacing="1.2">— IMPACTO</text>
    <text x="20" y="94" class="font-ui" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">-80%</text>
    <text x="22" y="122" class="font-ui" font-size="12.5" font-weight="600" fill="#E3E2F7">Tiempo en calzada</text>
    <text x="22" y="140" class="font-ui" font-size="11" font-weight="400" fill="#C9BFBF">Búsqueda reactiva eliminada</text>
  </g>

  <!-- 7. Tarjeta Inferior Izquierda: Filtros de Cochera Inteligentes -->
  <g id="card-filtros" filter="url(#shadow-card)" transform="translate(14, 452)">
    <rect x="0" y="0" width="248" height="114" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="16" y="28" class="font-ui" font-size="12.5" font-weight="700" fill="#231212">Filtros de cochera en tiempo real</text>

    <!-- Fila 1 de Filtros -->
    <g transform="translate(16, 42)">
      <!-- Chip 1: Techado -->
      <rect x="0" y="0" width="98" height="26" rx="13" fill="#EDF7F2" stroke="#C4EDDA" stroke-width="1" />
      <text x="49" y="17" class="font-ui" font-size="10.5" font-weight="600" fill="#1B7A4B" text-anchor="middle">✓ Techado</text>

      <!-- Chip 2: Cámaras 24/7 -->
      <rect x="106" y="0" width="110" height="26" rx="13" fill="#EDF7F2" stroke="#C4EDDA" stroke-width="1" />
      <text x="161" y="17" class="font-ui" font-size="10.5" font-weight="600" fill="#1B7A4B" text-anchor="middle">✓ Cámaras 24/7</text>
    </g>

    <!-- Fila 2 de Filtros -->
    <g transform="translate(16, 76)">
      <!-- Chip 3: Fracción 15 min -->
      <rect x="0" y="0" width="114" height="26" rx="13" fill="#FDF2EC" stroke="#F6D3C2" stroke-width="1" />
      <text x="57" y="17" class="font-ui" font-size="10.5" font-weight="600" fill="#C25E34" text-anchor="middle">✓ Fracción 15 min</text>

      <!-- Chip 4: Pase QR -->
      <rect x="122" y="0" width="94" height="26" rx="13" fill="#E3E2F7" stroke="#D1CEF0" stroke-width="1" />
      <text x="169" y="17" class="font-ui" font-size="10.5" font-weight="600" fill="#231212" text-anchor="middle">✓ Pase QR</text>
    </g>
  </g>
</svg>
