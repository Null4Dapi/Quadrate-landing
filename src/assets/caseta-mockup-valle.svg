<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 580" width="100%" height="100%" fill="none" role="img" aria-label="Mockup de Smartphone - Monetización y Tarifas Valle">
  <defs>
    <filter id="shadow-phone-valle" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <style>
    .font-ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Cuerpo Exterior del Teléfono -->
  <g filter="url(#shadow-phone-valle)">
    <rect x="20" y="20" width="300" height="540" rx="44" fill="#121720" stroke="#2D3748" stroke-width="5" />
    <rect x="25" y="25" width="290" height="530" rx="40" fill="none" stroke="#4A5568" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Superficie de Pantalla -->
  <rect x="30" y="30" width="280" height="520" rx="36" fill="#0C1017" />

  <!-- Dynamic Island -->
  <rect x="125" y="38" width="90" height="20" rx="10" fill="#000000" />
  <circle cx="198" cy="48" r="4.5" fill="#1A202C" />

  <!-- Barra de Estado Móvil -->
  <text x="56" y="52" class="font-ui" font-size="11" font-weight="600" fill="#E2E8F0">17:30</text>
  <path d="M260 44h18v9h-18z" fill="none" stroke="#E2E8F0" stroke-width="1.2" rx="2" />
  <rect x="262" y="46" width="12" height="5" fill="#48BB78" rx="1" />
  <circle cx="248" cy="48" r="3" fill="#E2E8F0" />

  <!-- Cabecera de la Aplicación -->
  <rect x="42" y="68" width="256" height="36" rx="8" fill="#171E28" />
  <circle cx="58" cy="86" r="6" fill="#C25E34" />
  <text x="70" y="90" class="font-ui" font-size="12" font-weight="700" fill="#FFFFFF">Quadrate Garita</text>
  <rect x="195" y="77" width="91" height="18" rx="9" fill="#1C3325" stroke="#22543D" stroke-width="1" />
  <circle cx="205" cy="86" r="3" fill="#48BB78" />
  <text x="213" y="89" class="font-ui" font-size="8.5" font-weight="700" fill="#48BB78">PROMO ACTIVA</text>

  <!-- Banner de Franja Valle Activa -->
  <rect x="42" y="114" width="256" height="80" rx="12" fill="#132018" stroke="#1D3E2B" stroke-width="1.2" />
  <rect x="54" y="126" width="125" height="18" rx="9" fill="#1E452E" />
  <text x="64" y="138" class="font-ui" font-size="8.5" font-weight="700" fill="#68D391">★ FRANJA VALLE ACTIVA</text>
  <text x="54" y="165" class="font-ui" font-size="18" font-weight="800" fill="#FFFFFF">14:00 – 17:00 hrs</text>
  <text x="54" y="181" class="font-ui" font-size="9" fill="#A0AEC0">Tarifa reducida por baja demanda en calzada</text>

  <!-- Tarjeta de Desglose Tarifario Dinámico -->
  <rect x="42" y="204" width="256" height="106" rx="12" fill="#171F2C" stroke="#233044" stroke-width="1.2" />
  <text x="56" y="224" class="font-ui" font-size="9" font-weight="600" fill="#94A3B8">Tarifa regular por hora:</text>
  <text x="56" y="244" class="font-ui" font-size="13" font-weight="600" fill="#718096" text-decoration="line-through">S/ 8.00 / h</text>

  <line x1="56" y1="254" x2="284" y2="254" stroke="#222C3C" stroke-width="1" />

  <text x="56" y="272" class="font-ui" font-size="9" font-weight="600" fill="#CBD5E0">Tarifa promocional activa:</text>
  <text x="56" y="296" class="font-ui" font-size="22" font-weight="800" fill="#F6AD55">S/ 4.80 <tspan font-size="11" font-weight="600" fill="#CBD5E0">/ hora</tspan></text>
  <rect x="214" y="276" width="70" height="20" rx="10" fill="#2D2115" stroke="#744210" stroke-width="1" />
  <text x="249" y="290" class="font-ui" font-size="9" font-weight="700" fill="#F6AD55" text-anchor="middle">-40% DTO</text>

  <!-- Métricas de Impacto Financiero y Operativo -->
  <g transform="translate(42, 320)">
    <rect x="0" y="0" width="256" height="48" rx="10" fill="#121822" stroke="#1E2A3A" stroke-width="1" />
    <circle cx="22" cy="24" r="10" fill="#1A2820" />
    <text x="22" y="28" class="font-ui" font-size="10" text-anchor="middle">📈</text>
    <text x="42" y="19" class="font-ui" font-size="8.5" fill="#94A3B8">Rotación vehicular proyectada</text>
    <text x="42" y="36" class="font-ui" font-size="12" font-weight="700" fill="#48BB78">+38% vehículos captados</text>
  </g>

  <g transform="translate(42, 376)">
    <rect x="0" y="0" width="256" height="48" rx="10" fill="#121822" stroke="#1E2A3A" stroke-width="1" />
    <circle cx="22" cy="24" r="10" fill="#2A1F18" />
    <text x="22" y="28" class="font-ui" font-size="10" text-anchor="middle">💰</text>
    <text x="42" y="19" class="font-ui" font-size="8.5" fill="#94A3B8">Ingreso adicional estimado</text>
    <text x="42" y="36" class="font-ui" font-size="12" font-weight="700" fill="#F6AD55">+S/ 240.00 / jornada</text>
  </g>

  <!-- Botón de Control de Reglas Dinámicas -->
  <rect x="42" y="434" width="256" height="34" rx="8" fill="#1C2633" stroke="#2B3A4F" stroke-width="1" />
  <text x="170" y="455" class="font-ui" font-size="10" font-weight="600" fill="#CBD5E0" text-anchor="middle">Reglas de optimización automáticas activas</text>

  <!-- Barra de Navegación Inferior -->
  <rect x="120" y="534" width="100" height="4" rx="2" fill="#4A5568" />
</svg>

