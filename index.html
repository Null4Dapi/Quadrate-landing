<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quadrate pe es la app web progresiva de las playas de estacionamiento de Lima: garita digital, aforo en vivo, caja con liquidación automática y demanda visible antes de llegar.">
  <title>Quadrate pe — La app web de estacionamiento de Lima</title>
  <link rel="preload" href="src/assets/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <button class="header__menu-toggle" type="button" aria-expanded="false" aria-controls="navegacion-principal" aria-label="Abrir menú de navegación">
        <span class="header__menu-icon" aria-hidden="true"><span class="header__menu-line"></span><span class="header__menu-line"></span><span class="header__menu-line"></span></span>
      </button>
      <a href="#inicio" class="header__brand" aria-label="Ir al inicio de Quadrate pe">
        <img src="src/assets/logo.webp" alt="" width="34" height="37" class="header__logo-img">
        <span class="header__logo-text">Quadrate</span>
        <span class="header__logo-badge">pe</span>
      </a>
      <nav id="navegacion-principal" class="header__nav" aria-label="Navegación principal">
        <ul class="header__nav-list">
          <li class="header__nav-item"><a href="#app" class="header__nav-link" data-texto="encabezado.enlacesNavegacion.0.etiqueta"></a></li>
          <li class="header__nav-item"><a href="#modulos" class="header__nav-link" data-texto="encabezado.enlacesNavegacion.1.etiqueta"></a></li>
          <li class="header__nav-item"><a href="#como-funciona" class="header__nav-link" data-texto="encabezado.enlacesNavegacion.2.etiqueta"></a></li>
          <li class="header__nav-item"><a href="#tarifas" class="header__nav-link" data-texto="encabezado.enlacesNavegacion.3.etiqueta"></a></li>
          <li class="header__nav-item"><a href="#contacto" class="header__nav-link" data-texto="encabezado.enlacesNavegacion.4.etiqueta"></a></li>
        </ul>
      </nav>
      <div class="header__actions"><a href="#contacto" class="header__cta" data-texto="encabezado.botonCtaNav"></a></div>
    </div>
  </header>

  <main id="contenido-principal">
    <!-- Hero: identidad display congelada (hero.css) -->
    <section id="inicio" class="hero" aria-labelledby="hero-titulo">
      <div class="hero__container">
        <div class="hero__content">
          <h1 id="hero-titulo" class="hero__title">
            <span class="hero__title-line hero__title-line--primary" data-texto="hero.tituloLinea1"></span>
            <span class="hero__title-line hero__title-line--accent" data-texto="hero.tituloLinea2"></span>
          </h1>
          <p class="hero__description" data-texto="hero.descripcionCorta"></p>
          <div class="hero__actions">
            <a href="#contacto" class="hero__button hero__button--primary" data-texto="hero.textoBotonPrincipal"></a>
          </div>
          <div class="hero__app-notice">
            <a href="#modulos" class="hero__app-label" data-texto="hero.textoEnlaceSecundario"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- La app en acción: pantalla referencial del conductor (CSS puro, sin imágenes) -->
    <section id="app" class="app-showcase" aria-labelledby="app-titulo">
      <div class="app-showcase__container">
        <article class="app-showcase__card">
          <div class="app-showcase__content">
            <h2 id="app-titulo" class="app-showcase__title">
              <span class="app-showcase__title-line" data-texto="appEnAccion.tituloLinea1"></span>
              <span class="app-showcase__title-line" data-texto="appEnAccion.tituloLinea2"></span>
            </h2>
            <p class="app-showcase__subtitle">
              <span class="app-showcase__subtitle-line" data-texto="appEnAccion.subtituloLinea1"></span>
              <span class="app-showcase__subtitle-line" data-texto="appEnAccion.subtituloLinea2"></span>
            </p>
            <div class="app-showcase__actions">
              <a href="#contacto" class="app-showcase__button" data-texto="appEnAccion.botonTexto"></a>
            </div>
          </div>
          <div class="app-showcase__visual">
            <figure class="app-showcase__figure" aria-hidden="true">
              <div class="app-showcase__device" data-screen="referencial">
                <div class="app-showcase__screen-topbar">
                  <span class="app-showcase__screen-marca" data-texto="appEnAccion.pantallaConductor.marca"></span>
                  <span class="app-showcase__screen-estado" data-texto="appEnAccion.pantallaConductor.encabezadoEstado"></span>
                </div>
                <div class="app-showcase__screen-map">
                  <span class="app-showcase__pin app-showcase__pin--a"><span class="app-showcase__pin-dot"></span><span class="app-showcase__pin-label" data-texto="appEnAccion.pantallaConductor.pinUno"></span></span>
                  <span class="app-showcase__pin app-showcase__pin--b app-showcase__pin--ocupado"><span class="app-showcase__pin-dot"></span><span class="app-showcase__pin-label" data-texto="appEnAccion.pantallaConductor.pinDos"></span></span>
                  <span class="app-showcase__pin app-showcase__pin--c"><span class="app-showcase__pin-dot"></span><span class="app-showcase__pin-label" data-texto="appEnAccion.pantallaConductor.pinTres"></span></span>
                </div>
                <div class="app-showcase__sheet">
                  <p class="app-showcase__sheet-ruta" data-texto="appEnAccion.pantallaConductor.rutaActiva"></p>
                  <p class="app-showcase__sheet-aforo" data-texto="appEnAccion.pantallaConductor.aforoVisible"></p>
                  <span class="app-showcase__sheet-accion" data-texto="appEnAccion.pantallaConductor.accionDestino"></span>
                </div>
              </div>
            </figure>
          </div>
        </article>
      </div>
    </section>

    <!-- Módulos: filas editoriales asimétricas, sin tarjetas uniformes -->
    <section id="modulos" class="modules" aria-labelledby="modulos-titulo">
      <div class="modules__container">
        <header class="modules__header">
          <h2 id="modulos-titulo" class="modules__title" data-texto="modulos.tituloSeccion"></h2>
          <p class="modules__description" data-texto="modulos.descripcionSeccion"></p>
        </header>
        <ul class="modules__list">
          <li class="modules__item">
            <h3 class="modules__name" data-texto="modulos.filas.0.nombre"></h3>
            <p class="modules__benefit"><span class="modules__chip" data-screen="referencial" aria-hidden="true"></span> <span data-texto="modulos.filas.0.beneficio"></span></p>
          </li>
          <li class="modules__item">
            <h3 class="modules__name" data-texto="modulos.filas.1.nombre"></h3>
            <p class="modules__benefit" data-texto="modulos.filas.1.beneficio"></p>
          </li>
          <li class="modules__item">
            <h3 class="modules__name" data-texto="modulos.filas.2.nombre"></h3>
            <p class="modules__benefit" data-texto="modulos.filas.2.beneficio"></p>
          </li>
          <li class="modules__item">
            <h3 class="modules__name" data-texto="modulos.filas.3.nombre"></h3>
            <p class="modules__benefit" data-texto="modulos.filas.3.beneficio"></p>
          </li>
        </ul>
      </div>
    </section>

    <!-- Cómo funciona: secuencia numerada real -->
    <section id="como-funciona" class="how-it-works" aria-labelledby="como-funciona-titulo">
      <div class="how-it-works__container">
        <header class="how-it-works__header">
          <h2 id="como-funciona-titulo" class="how-it-works__title" data-texto="comoFunciona.tituloSeccion"></h2>
          <p class="how-it-works__description" data-texto="comoFunciona.descripcionSeccion"></p>
        </header>
        <ol class="how-it-works__list">
          <li class="how-it-works__step">
            <h3 class="how-it-works__step-title" data-texto="comoFunciona.pasos.0.titulo"></h3>
            <p class="how-it-works__step-detail" data-texto="comoFunciona.pasos.0.detalle"></p>
          </li>
          <li class="how-it-works__step">
            <h3 class="how-it-works__step-title" data-texto="comoFunciona.pasos.1.titulo"></h3>
            <p class="how-it-works__step-detail" data-texto="comoFunciona.pasos.1.detalle"></p>
          </li>
          <li class="how-it-works__step">
            <h3 class="how-it-works__step-title" data-texto="comoFunciona.pasos.2.titulo"></h3>
            <p class="how-it-works__step-detail" data-texto="comoFunciona.pasos.2.detalle"></p>
          </li>
        </ol>
      </div>
    </section>

    <!-- Tarifas: transparencia para las dos caras -->
    <section id="tarifas" class="rates" aria-labelledby="tarifas-titulo">
      <div class="rates__container">
        <header class="rates__header">
          <span class="rates__eyebrow" data-texto="tarifas.etiquetaSeccion"></span>
          <h2 id="tarifas-titulo" class="rates__title" data-texto="tarifas.tituloSeccion"></h2>
          <p class="rates__description" data-texto="tarifas.descripcionSeccion"></p>
        </header>
        <div class="rates__breakdown">
          <article class="rates__row"><h3 class="rates__row-category" data-texto="tarifas.filas.0.categoria"></h3><p class="rates__row-rule" data-texto="tarifas.filas.0.regla"></p><span class="rates__row-impact" data-texto="tarifas.filas.0.impacto"></span></article>
          <article class="rates__row"><h3 class="rates__row-category" data-texto="tarifas.filas.1.categoria"></h3><p class="rates__row-rule" data-texto="tarifas.filas.1.regla"></p><span class="rates__row-impact" data-texto="tarifas.filas.1.impacto"></span></article>
          <article class="rates__row"><h3 class="rates__row-category" data-texto="tarifas.filas.2.categoria"></h3><p class="rates__row-rule" data-texto="tarifas.filas.2.regla"></p><span class="rates__row-impact" data-texto="tarifas.filas.2.impacto"></span></article>
        </div>
      </div>
    </section>

    <!-- Manifiesto: tesis de la caseta digital (banda de contraste existente) -->
    <section id="manifiesto" class="manifesto" aria-labelledby="manifiesto-titulo">
      <div class="manifesto__container">
        <div class="manifesto__statement">
          <span class="manifesto__eyebrow" data-texto="manifiesto.etiqueta"></span>
          <h2 id="manifiesto-titulo" class="manifesto__text" data-texto="manifiesto.declaracion"></h2>
        </div>
        <aside class="manifesto__action-card">
          <span class="manifesto__number" data-texto="manifiesto.metricaCifra"></span>
          <h3 class="manifesto__label" data-texto="manifiesto.metricaRotulo"></h3>
          <p class="manifesto__detail" data-texto="manifiesto.metricaDetalle"></p>
          <a href="#contacto" class="manifesto__button" data-texto="manifiesto.botonAccion"></a>
        </aside>
      </div>
    </section>

    <!-- Contacto: formulario de lista de espera (lógica en features/waitlist.js) -->
    <section id="contacto" class="waitlist" aria-labelledby="contacto-titulo">
      <div class="waitlist__container">
        <header class="waitlist__header">
          <span class="waitlist__eyebrow" data-texto="formularioEspera.etiquetaFormulario"></span>
          <h2 id="contacto-titulo" class="waitlist__title" data-texto="formularioEspera.tituloFormulario"></h2>
          <p class="waitlist__description" data-texto="formularioEspera.descripcionFormulario"></p>
        </header>
        <form class="waitlist__form" novalidate>
          <div class="waitlist__field">
            <label for="lista-nombre" class="waitlist__label" data-texto="formularioEspera.campos.nombreLabel"></label>
            <input type="text" id="lista-nombre" name="nombre" class="waitlist__input" autocomplete="name" data-placeholder="formularioEspera.campos.nombrePlaceholder">
          </div>
          <div class="waitlist__field">
            <label for="lista-correo" class="waitlist__label" data-texto="formularioEspera.campos.correoLabel"></label>
            <input type="email" id="lista-correo" name="correo" class="waitlist__input" autocomplete="email" data-placeholder="formularioEspera.campos.correoPlaceholder">
          </div>
          <div class="waitlist__field">
            <label for="lista-rol" class="waitlist__label" data-texto="formularioEspera.campos.rolLabel"></label>
            <select id="lista-rol" name="rol" class="waitlist__select">
              <option value="" disabled selected data-texto="formularioEspera.campos.opcionPlaceholder"></option>
              <option value="conductor" data-texto="formularioEspera.campos.opcionesRol.0.texto"></option>
              <option value="playa" data-texto="formularioEspera.campos.opcionesRol.1.texto"></option>
            </select>
          </div>
          <div class="waitlist__field">
            <label for="lista-detalle" class="waitlist__label" data-texto="formularioEspera.campos.vehiculoOCocheraLabel"></label>
            <input type="text" id="lista-detalle" name="detalle" class="waitlist__input" data-placeholder="formularioEspera.campos.vehiculoOCocheraPlaceholder">
          </div>
          <button type="submit" class="waitlist__submit" data-texto="formularioEspera.campos.botonEnvio"></button>
          <div class="waitlist__feedback" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__main">
        <div class="footer__brand"><span class="footer__logo-text">Quadrate</span><span class="footer__logo-badge">pe</span></div>
        <p class="footer__description" data-texto="piePagina.descripcionMarca"></p>
        <nav class="footer__links-nav" aria-label="Enlaces de navegación secundaria">
          <a href="#app" class="footer__link" data-texto="piePagina.enlaces.0.etiqueta"></a>
          <a href="#modulos" class="footer__link" data-texto="piePagina.enlaces.1.etiqueta"></a>
          <a href="#tarifas" class="footer__link" data-texto="piePagina.enlaces.2.etiqueta"></a>
          <a href="#contacto" class="footer__link" data-texto="piePagina.enlaces.3.etiqueta"></a>
          <a href="mailto:contacto@quadrate.pe" class="footer__link" data-texto="piePagina.enlaces.4.etiqueta"></a>
        </nav>
      </div>
      <div class="footer__bottom">
        <p class="footer__copyright" data-texto="piePagina.derechosReservados"></p>
        <small class="footer__meta" data-meta="version"></small>
      </div>
    </div>
  </footer>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
