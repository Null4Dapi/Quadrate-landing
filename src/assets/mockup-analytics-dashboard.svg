<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 400" width="100%" height="100%" fill="none" role="img" aria-label="Mockup Analytics Dashboard">
  <defs>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <clipPath id="thumb-sneaker-clip">
      <rect x="44" y="156" width="36" height="40" rx="6" />
    </clipPath>
    <clipPath id="container-clip">
      <rect x="0" y="0" width="440" height="400" rx="24" />
    </clipPath>
  </defs>

  <style>
    .font-ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bg-dark { fill: #361713; }
    .card-surface { fill: #FFFFFF; }
    .text-light { fill: #FFFFFF; }
    .text-dark { fill: #1E2328; }
    .text-muted { fill: #718096; }
    .pill-filter { fill: #F1F5F9; }
  </style>

  <!-- Contenedor Principal Oscuro -->
  <g clip-path="url(#container-clip)">
    <rect x="0" y="0" width="440" height="400" class="bg-dark" />

    <!-- Titular Editorial Superior -->
    <text x="34" y="68" class="font-ui text-light" font-size="32" font-weight="400" letter-spacing="-0.5">Don't take our</text>
    <text x="34" y="106" class="font-ui text-light" font-size="32" font-weight="400" letter-spacing="-0.5">word for it.</text>

    <!-- Tarjeta Blanca de Métricas / Dashboard -->
    <g id="dashboard-card" filter="url(#shadow-card)">
      <rect x="24" y="136" width="416" height="264" rx="22" class="card-surface" />

      <!-- Fila de Producto -->
      <!-- Miniatura zapatilla roja -->
      <rect x="42" y="154" width="40" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <g clip-path="url(#thumb-sneaker-clip)">
        <image href="data:image/jpeg;base64," x="44" y="156" width="36" height="40" preserveAspectRatio="xMidYMid slice" />
      </g>
      <text x="96" y="182" class="font-ui text-dark" font-size="17" font-weight="700">Product visits</text>

      <!-- Fila de Filtros / Contexto -->
      <text x="42" y="226" class="font-ui text-muted" font-size="12" font-weight="500">on</text>

      <!-- Pill 1: Shoppable Videos -->
      <rect x="62" y="211" width="124" height="24" rx="6" class="pill-filter" />
      <!-- Ícono marco / pantalla -->
      <path d="M 72 218 H 70 V 220 M 80 218 H 82 V 220 M 70 226 V 228 H 72 M 82 226 V 228 H 80" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="88" y="227" class="font-ui text-dark" font-size="11" font-weight="500">Shoppable Videos</text>

      <text x="194" y="226" class="font-ui text-muted" font-size="12" font-weight="500">in</text>

      <!-- Pill 2: Nike Runner -->
      <rect x="210" y="211" width="98" height="24" rx="6" class="pill-filter" />
      <!-- Ícono carpeta -->
      <path d="M 220 218 H 224 L 226 220 H 232 V 227 H 220 Z" fill="none" stroke="#64748B" stroke-width="1.2" />
      <text x="236" y="227" class="font-ui text-dark" font-size="11" font-weight="500">Nike Runner</text>

      <!-- Bloque de 3 KPIs -->
      <!-- KPI 1: Product Views -->
      <text x="42" y="278" class="font-ui text-dark" font-size="20" font-weight="700" letter-spacing="-0.5">104,887</text>
      <g transform="translate(42, 290)">
        <path d="M 2 11 V 7 M 6 11 V 3 M 10 11 V 5" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
        <text x="16" y="10" class="font-ui text-muted" font-size="11" font-weight="500">Product Views</text>
      </g>

      <!-- Divisor vertical 1 -->
      <line x1="160" y1="264" x2="160" y2="306" stroke="#E2E8F0" stroke-width="1" />

      <!-- KPI 2: Product Conversion -->
      <text x="176" y="278" class="font-ui text-dark" font-size="20" font-weight="700" letter-spacing="-0.5">3,216</text>
      <g transform="translate(176, 290)">
        <path d="M 3 8 L 7 4 L 11 8 M 7 4 V 11" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="16" y="10" class="font-ui text-muted" font-size="11" font-weight="500">Product conversion</text>
      </g>

      <!-- Divisor vertical 2 -->
      <line x1="296" y1="264" x2="296" y2="306" stroke="#E2E8F0" stroke-width="1" />

      <!-- KPI 3: Revenue -->
      <text x="310" y="278" class="font-ui text-dark" font-size="20" font-weight="700" letter-spacing="-0.5">$9,750</text>
      <g transform="translate(310, 290)">
        <circle cx="6" cy="6" r="5" stroke="#94A3B8" stroke-width="1.2" fill="none" />
        <text x="6" y="9" class="font-ui text-muted" font-size="8" font-weight="700" text-anchor="middle">$</text>
        <text x="16" y="10" class="font-ui text-muted" font-size="11" font-weight="500">Revenue</text>
      </g>

      <!-- Fila de Botones de Acción -->
      <!-- Botón 1: Session replay -->
      <g transform="translate(42, 334)">
        <rect x="0" y="0" width="126" height="34" rx="17" fill="#12161A" />
        <path d="M 16 11 L 23 17 L 16 23 Z" fill="#FFFFFF" />
        <text x="32" y="21" class="font-ui text-light" font-size="11.5" font-weight="600">Session replay</text>
      </g>

      <!-- Botón 2: Save a new segment -->
      <g transform="translate(176, 334)">
        <rect x="0" y="0" width="148" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
        <text x="74" y="21" class="font-ui text-dark" font-size="11.5" font-weight="600" text-anchor="middle">Save a new segment</text>
      </g>
    </g>
  </g>
</svg>